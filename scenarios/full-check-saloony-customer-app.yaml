name: full-check-saloony-customer-app

startUrl: http://localhost:8091/

instruction: |
  Exercise the main customer-facing features of the Saloony app,
  including authentication, location, salon discovery, service selection,
  booking, and booking management.

  - Sign in using the test account with phone number +917293786099.

  - Complete the location flow. Allow location access if available.
    If automatic location does not work, select Kozhikode manually.

  - Explore the main customer-facing navigation and screens.
    Exercise each meaningful feature you discover at least once.
    Do not repeatedly test the same control or flow without a reason.

  - Browse the available salons and exercise the available salon
    discovery features such as search, categories, filters, sorting,
    or location-based discovery when present.

  - Open multiple salon detail pages and inspect the information
    available to customers, including services, prices, staff,
    availability, ratings, descriptions, or other details when present.

  - Exercise service selection and the booking flow.

  - Successfully create at least three bookings. Use different
    combinations of salon/service and different dates or time slots
    where the application allows it.

  - Verify through the application's booking/history screens that the
    created bookings are present and have the expected salon, service,
    date, time, and booking status.

  - Exercise booking-detail functionality for at least one created
    booking.

  - If rescheduling is supported, reschedule one test booking to a
    different available date or time and confirm that the change is
    reflected in the application.

  - If cancellation is supported, cancel no more than one test booking
    and confirm that its status changes appropriately. Leave at least
    one successfully confirmed booking active at the end of the test.

  - Exercise other meaningful customer-facing features exposed by the
    application, such as favourites, profile/account settings, reviews,
    offers, notifications, or similar features when they are available
    and can be tested safely.

  - Avoid destructive account actions such as deleting the account.
    Do not make real payments or trigger irreversible external actions
    unless the application is clearly using test or sandbox data.

  - Recover from ordinary validation errors or unavailable booking slots
    by selecting valid alternatives.

  - Do not overdo the test. The goal is broad feature coverage, not
    exhaustive combinations. Exercise each major customer workflow
    sufficiently to establish that it works.

  - Finish on the booking/history screen with the confirmed bookings
    visible after exercising the major customer-facing workflows.

proof:
  - type: judge
    text: |
      The execution evidence shows that the user successfully signed in
      and reached the usable customer application.

  - type: judge
    text: |
      The execution evidence shows that location was successfully
      established, using Kozhikode if automatic location was unavailable.

  - type: judge
    text: |
      The execution evidence shows meaningful coverage of the application's
      main customer-facing features rather than only the booking button.

  - type: judge
    text: |
      At least three booking flows were successfully completed using
      different booking data, including different dates or time slots
      where the application allowed it.

  - type: judge
    text: |
      The created bookings were visible in the application's booking or
      history interface with information consistent with what was selected
      during booking.

  - type: judge
    text: |
      If booking rescheduling or cancellation was available, the execution
      evidence shows that the supported booking-management functionality
      was exercised successfully.

  - type: judge
    text: |
      The run completed without an unresolved blocking application error,
      and at least one valid confirmed booking remained at the end of the
      scenario.

maxSteps: 200
maxDuration: 90m
